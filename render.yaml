# Render Blueprint: a free web service and a free PostgreSQL database.
# New → Blueprint → pick this repository. Render asks for the values marked sync: false.
services:
  - type: web
    name: orbit-care
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ORBIT_STORE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-db
          property: connectionString
      - key: ORBIT_SECRET_KEY
        generateValue: true
      - key: ORBIT_TICK_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: orbit-db
    plan: free
    region: singapore
    databaseName: orbit
    user: orbit
