name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbit" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ORBIT_TEST_DATABASE_URL: postgresql://orbit:orbit@localhost:5432/orbit_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt ruff==0.16.9 pip-audit==2.9.0
      - run: ruff check app tests
      - run: pip-audit -r requirements.txt
      - run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=85
